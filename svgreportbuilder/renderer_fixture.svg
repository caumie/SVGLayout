<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="210mm" height="297mm" viewBox="0 0 210 297">
  <defs>
    <linearGradient id="header_gradient"><stop offset="0" stop-color="#ffffff" /></linearGradient>
    <clipPath id="items_clip"><rect x="10" y="70" width="190" height="80" /></clipPath>
  </defs>
  <style>.accent { fill:url(#header_gradient); } #customer_name_box { stroke:#222; }</style>
  <g id="page_content" transform="translate(0 5)">
    <rect id="header" class="accent" x="10" y="10" width="190" height="30" />
    <animate id="header_animation" begin="header.begin" attributeName="opacity" from="0" to="1" dur="1s" />
    <rect id="customer_name_box" x="20" y="20" width="120" height="10" fill="none" />
    <path id="header_border" d="M10,10h190" />
    <g id="item_group" clip-path="url(#items_clip)">
      <rect id="item_0_name_box" x="20" y="75" width="100" height="12" />
      <rect id="item_1_name_box" x="20" y="90" width="100" height="12" />
      <rect id="barcode_box" x="140" y="75" width="40" height="40" />
    </g>
  </g>
  <use id="header_copy" xlink:href="#header" />
</svg>
