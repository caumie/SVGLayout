<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>請求書</title>
  <style>
    /* ページ全体の設定 */
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
    }

    /* A4サイズの紙風容器 */
    .invoice-container {
      width: 210mm;
      height: 297mm;
      background-color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      margin: 0 auto;
      /* transform-origin: top left; */
      /* 縮小の基準点を左上に設定 */
    }

    @media print {
      .body {
        margin: 0;
        padding: 0;
      }

      .invoice-container {
        box-shadow: none;
        margin: 0;
        background-color: gray;
      }

      .invoice-container::after {
        break-before: page;
      }
    }

    /* SVG表示用設定 */
    img {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div class="invoice-container">
    <!-- 外部SVGファイルを参照 -->
    <img style="object-fit: contain;" src="./example1_after.svg" />
  </div>

</body>

</html>
