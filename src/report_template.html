    <style>
        @page {
            size: A4 portrait;
            margin: 0; /* ヘッダー・フッターが出力されないように */
        }

        * {
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 210mm;
            color-adjust: exact;
        }

        svg {
            width: 210mm;
            height: 295.5mm; /* 297mmだと2ページ目にはみ出してしまうので微調整 */
            page-break-after: always;
        }

        /* プレビュー用 */
        @media screen {
            body {
                background: #ccc;
                margin: 0 auto;
            }

            svg {
                background: #fff;
                box-shadow: 0 .5mm 2mm rgba(0,0,0,.3);
                margin-top: 5mm;
            }
        }
    </style>

    <!-- SVGをここに埋め込みます -->
    <script>
        // プレースホルダーを実際の値に置換する関数
        function replacePlaceholders(data) {
            const svg = document.getElementById('view');
            const textElements = svg.getElementsByTagName('text');

            for (let i = 0; i < textElements.length; i++) {
                let textElement = textElements[i];
                let textContent = textElement.textContent;

                // プレースホルダーの置換
                for (const key in data) {
                    const placeholder = `%${key}%`;
                    if (textContent.includes(placeholder)) {
                        textContent = textContent.replace(placeholder, data[key]);
                    }
                }
                textElement.textContent = textContent;
            }
        }

        // フォントファミリーを設定する関数
        function setFontFamily() {
            const svg = document.getElementById('view');
            const textElements = svg.getElementsByTagName('text');

            for (let i = 0; i < textElements.length; i++) {
                let textElement = textElements[i];
                textElement.setAttribute('font-family', 'MS-Gothic'); // 適切なフォントを設定
            }
        }
