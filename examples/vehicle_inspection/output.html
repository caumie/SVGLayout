<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>車両点検表</title>
<style>
  @page { size:A4 portrait; margin:0; } body { margin:0; padding:8mm; background:#d7dbe0; font-family:system-ui,sans-serif; }
  main { max-width:220mm; margin:auto; } .comparison { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6mm; }
  h1 { font-size:6mm; color:#27323a; } h2 { font-size:4mm; color:#27323a; } .paper { background:white; border:.3mm solid #aab4bc; box-shadow:0 1mm 4mm #68717a66; } img { display:block; width:100%; height:auto; }
  @media(max-width:900px){.comparison{grid-template-columns:1fr}} @media print{body{padding:0;background:white}.paper{box-shadow:none}}
</style></head><body><main><h1>車両点検表</h1><div class="comparison"><section><h2>テンプレート</h2><div class="paper"><img src="template.svg" alt="車両点検表テンプレート"></div></section><section><h2>差し込み結果</h2><div class="paper"><img src="output.svg" alt="車両点検表の差し込み結果"></div></section></div></main></body></html>
