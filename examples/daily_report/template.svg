<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>作業日報</title>
  <style>
    .paper { fill:#fff; stroke:#1f2933; stroke-width:.35; }
    .line { fill:#fff; stroke:#1f2933; stroke-width:.25; }
    .shade { fill:#e9f0f5; stroke:#1f2933; stroke-width:.25; }
    .header { fill:#3f6b5b; }
    .head { fill:#fff; font-family:'Yu Mincho','Noto Serif JP',serif; font-size:8px; font-weight:700; letter-spacing:1px; }
    .header-label { fill:#fff; }
    .label { fill:#24323d; font-family:'Yu Gothic','Meiryo',sans-serif; font-size:3px; }
    .small { fill:#24323d; font-family:'Yu Gothic','Meiryo',sans-serif; font-size:2.7px; }
    .tiny { fill:#24323d; font-family:'Yu Gothic','Meiryo',sans-serif; font-size:2.15px; }
  </style>

  <rect class="paper" x=".5" y=".5" width="209" height="296"/>
  <rect class="header" x="10" y="10" width="190" height="18" rx="1.5"/><text class="head" x="16" y="21">作 業 日 報</text>
  <text class="small header-label" x="145" y="16">報告番号</text><rect id="report_number_box" class="line" x="163" y="12" width="33" height="7"/>
  <text class="small header-label" x="145" y="25">提出日</text><rect id="submit_date_box" class="line" x="163" y="21" width="33" height="7"/>

  <rect class="line" x="10" y="34" width="190" height="31"/>
  <line x1="10" y1="44" x2="200" y2="44" stroke="#1f2933" stroke-width=".25"/><line x1="10" y1="54" x2="200" y2="54" stroke="#1f2933" stroke-width=".25"/>
  <line x1="55" y1="34" x2="55" y2="65" stroke="#1f2933" stroke-width=".25"/><line x1="108" y1="34" x2="108" y2="65" stroke="#1f2933" stroke-width=".25"/><line x1="153" y1="34" x2="153" y2="65" stroke="#1f2933" stroke-width=".25"/>
  <text class="tiny" x="12" y="40">所属部署</text><rect id="department_box" class="line" x="30" y="36" width="23" height="7"/>
  <text class="tiny" x="57" y="40">氏名</text><rect id="employee_name_box" class="line" x="69" y="36" width="36" height="7"/>
  <text class="tiny" x="110" y="40">社員番号</text><rect id="employee_number_box" class="line" x="129" y="36" width="21" height="7"/>
  <text class="tiny" x="155" y="40">勤務区分</text><rect id="shift_box" class="line" x="174" y="36" width="24" height="7"/>
  <text class="tiny" x="12" y="50">作業日</text><rect id="work_date_box" class="line" x="30" y="46" width="45" height="7"/>
  <text class="tiny" x="77" y="50">天候</text><rect id="weather_box" class="line" x="88" y="46" width="17" height="7"/>
