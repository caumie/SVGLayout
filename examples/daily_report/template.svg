  <g><rect id="allocation_0_name_box" class="line" x="12" y="249" width="30" height="7"/><rect id="allocation_0_hours_box" class="line" x="42" y="249" width="27" height="7"/><rect id="allocation_1_name_box" class="line" x="12" y="256" width="30" height="7"/><rect id="allocation_1_hours_box" class="line" x="42" y="256" width="27" height="7"/><rect id="allocation_2_name_box" class="line" x="12" y="263" width="30" height="7"/><rect id="allocation_2_hours_box" class="line" x="42" y="263" width="27" height="7"/><rect id="allocation_3_name_box" class="line" x="12" y="270" width="30" height="7"/><rect id="allocation_3_hours_box" class="line" x="42" y="270" width="27" height="7"/><rect id="allocation_4_name_box" class="line" x="12" y="277" width="30" height="10"/><rect id="allocation_4_hours_box" class="line" x="42" y="277" width="27" height="10"/></g>
  <text class="label" x="78" y="244">特記事項・改善提案</text><rect id="notes_box" class="line" x="78" y="247" width="122" height="25"/>
  <rect class="line" x="78" y="276" width="122" height="13"/><text class="tiny" x="80" y="281">作業者</text><rect id="worker_sign_box" class="line" x="94" y="278" width="23" height="9"/><text class="tiny" x="120" y="281">班長</text><rect id="leader_sign_box" class="line" x="132" y="278" width="23" height="9"/><text class="tiny" x="158" y="281">確認日</text><rect id="confirmed_date_box" class="line" x="171" y="278" width="27" height="9"/>
