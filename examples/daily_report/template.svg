    <rect id="work_4_time_box" class="line" x="10" y="120" width="30" height="9"/><rect id="work_4_content_box" class="line" x="40" y="120" width="110" height="9"/><rect id="work_4_job_number_box" class="line" x="150" y="120" width="25" height="9"/><rect id="work_4_hours_box" class="line" x="175" y="120" width="25" height="9"/>
    <rect id="work_5_time_box" class="line" x="10" y="129" width="30" height="9"/><rect id="work_5_content_box" class="line" x="40" y="129" width="110" height="9"/><rect id="work_5_job_number_box" class="line" x="150" y="129" width="25" height="9"/><rect id="work_5_hours_box" class="line" x="175" y="129" width="25" height="9"/>
