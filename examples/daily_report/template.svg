    <rect id="material_3_name_box" class="line" x="10" y="178" width="43" height="7"/><rect id="material_3_spec_box" class="line" x="53" y="178" width="43" height="7"/><rect id="material_3_quantity_box" class="line" x="96" y="178" width="30" height="7"/><rect id="material_3_unit_box" class="line" x="126" y="178" width="17" height="7"/><rect id="material_3_note_box" class="line" x="143" y="178" width="57" height="7"/>
    <rect id="material_4_name_box" class="line" x="10" y="185" width="43" height="7"/><rect id="material_4_spec_box" class="line" x="53" y="185" width="43" height="7"/><rect id="material_4_quantity_box" class="line" x="96" y="185" width="30" height="7"/><rect id="material_4_unit_box" class="line" x="126" y="185" width="17" height="7"/><rect id="material_4_note_box" class="line" x="143" y="185" width="57" height="7"/>
