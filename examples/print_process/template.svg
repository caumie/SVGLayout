<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>印刷工程進行票</title>
  <style>
    .paper { fill:#fff; stroke:#1f2933; stroke-width:.35; }
    .line { fill:#fff; stroke:#1f2933; stroke-width:.25; }
    .shade { fill:#e7eef5; stroke:#1f2933; stroke-width:.25; }
    .header { fill:#40566f; }
    .head { fill:#fff; font-family:'Yu Mincho','Noto Serif JP',serif; font-size:7.5px; font-weight:700; letter-spacing:.7px; }
    .header-label { fill:#fff; }
    .label { fill:#24323d; font-family:'Yu Gothic','Meiryo',sans-serif; font-size:3px; }
    .small { fill:#24323d; font-family:'Yu Gothic','Meiryo',sans-serif; font-size:2.7px; }
    .tiny { fill:#24323d; font-family:'Yu Gothic','Meiryo',sans-serif; font-size:2.15px; }
  </style>

  <rect class="paper" x=".5" y=".5" width="209" height="296"/>
  <rect class="header" x="10" y="10" width="190" height="18" rx="1.5"/><text class="head" x="16" y="21">印 刷 工 程 進 行 票</text>
  <text class="small header-label" x="145" y="16">JOB No.</text><rect id="job_number_box" class="line" x="163" y="12" width="33" height="7"/>
  <text class="small header-label" x="145" y="25">作成日</text><rect id="created_date_box" class="line" x="163" y="21" width="33" height="7"/>

  <rect class="line" x="10" y="34" width="190" height="25"/>
  <line x1="10" y1="42" x2="200" y2="42" stroke="#1f2933" stroke-width=".25"/><line x1="10" y1="50" x2="200" y2="50" stroke="#1f2933" stroke-width=".25"/>
  <line x1="58" y1="34" x2="58" y2="59" stroke="#1f2933" stroke-width=".25"/><line x1="126" y1="34" x2="126" y2="59" stroke="#1f2933" stroke-width=".25"/>
  <text class="tiny" x="12" y="39">得意先</text><rect id="customer_box" class="line" x="28" y="36" width="27" height="7"/>
  <text class="tiny" x="60" y="39">品名</text><rect id="product_box" class="line" x="71" y="36" width="51" height="7"/>
  <text class="tiny" x="128" y="39">納期</text><rect id="due_date_box" class="line" x="140" y="36" width="58" height="7"/>
  <text class="tiny" x="12" y="47">仕様</text><rect id="specification_box" class="line" x="28" y="44" width="94" height="7"/>
  <text class="tiny" x="128" y="47">部数</text><rect id="quantity_box" class="line" x="140" y="44" width="27" height="7"/>
  <text class="tiny" x="169" y="47">担当</text><rect id="operator_box" class="line" x="179" y="44" width="19" height="7"/>
  <text class="tiny" x="12" y="55">備考</text><rect id="job_note_box" class="line" x="28" y="52" width="170" height="6"/>

  <text class="label" x="10" y="67">工程進捗</text><rect class="shade" x="10" y="70" width="190" height="8"/>
  <text class="tiny" x="28" y="75" text-anchor="middle">工程</text><text class="tiny" x="57" y="75" text-anchor="middle">状態</text><text class="tiny" x="84" y="75" text-anchor="middle">予定</text><text class="tiny" x="117.5" y="75" text-anchor="middle">実績</text><text class="tiny" x="167.5" y="75" text-anchor="middle">担当・コメント</text>
  <g>
    <rect id="process_0_name_box" class="line" x="10" y="78" width="36" height="10"/><rect id="process_0_status_box" class="line" x="46" y="78" width="22" height="10"/><rect id="process_0_plan_box" class="line" x="68" y="78" width="32" height="10"/><rect id="process_0_actual_box" class="line" x="100" y="78" width="35" height="10"/><rect id="process_0_operator_box" class="line" x="135" y="78" width="65" height="10"/>
    <rect id="process_1_name_box" class="line" x="10" y="88" width="36" height="10"/><rect id="process_1_status_box" class="line" x="46" y="88" width="22" height="10"/><rect id="process_1_plan_box" class="line" x="68" y="88" width="32" height="10"/><rect id="process_1_actual_box" class="line" x="100" y="88" width="35" height="10"/><rect id="process_1_operator_box" class="line" x="135" y="88" width="65" height="10"/>
    <rect id="process_2_name_box" class="line" x="10" y="98" width="36" height="10"/><rect id="process_2_status_box" class="line" x="46" y="98" width="22" height="10"/><rect id="process_2_plan_box" class="line" x="68" y="98" width="32" height="10"/><rect id="process_2_actual_box" class="line" x="100" y="98" width="35" height="10"/><rect id="process_2_operator_box" class="line" x="135" y="98" width="65" height="10"/>
    <rect id="process_3_name_box" class="line" x="10" y="108" width="36" height="10"/><rect id="process_3_status_box" class="line" x="46" y="108" width="22" height="10"/><rect id="process_3_plan_box" class="line" x="68" y="108" width="32" height="10"/><rect id="process_3_actual_box" class="line" x="100" y="108" width="35" height="10"/><rect id="process_3_operator_box" class="line" x="135" y="108" width="65" height="10"/>
    <rect id="process_4_name_box" class="line" x="10" y="118" width="36" height="10"/><rect id="process_4_status_box" class="line" x="46" y="118" width="22" height="10"/><rect id="process_4_plan_box" class="line" x="68" y="118" width="32" height="10"/><rect id="process_4_actual_box" class="line" x="100" y="118" width="35" height="10"/><rect id="process_4_operator_box" class="line" x="135" y="118" width="65" height="10"/>
    <rect id="process_5_name_box" class="line" x="10" y="128" width="36" height="10"/><rect id="process_5_status_box" class="line" x="46" y="128" width="22" height="10"/><rect id="process_5_plan_box" class="line" x="68" y="128" width="32" height="10"/><rect id="process_5_actual_box" class="line" x="100" y="128" width="35" height="10"/><rect id="process_5_operator_box" class="line" x="135" y="128" width="65" height="10"/>
    <rect id="process_6_name_box" class="line" x="10" y="138" width="36" height="10"/><rect id="process_6_status_box" class="line" x="46" y="138" width="22" height="10"/><rect id="process_6_plan_box" class="line" x="68" y="138" width="32" height="10"/><rect id="process_6_actual_box" class="line" x="100" y="138" width="35" height="10"/><rect id="process_6_operator_box" class="line" x="135" y="138" width="65" height="10"/>
  </g>

  <text class="label" x="10" y="157">用紙・資材</text><rect class="shade" x="10" y="160" width="92" height="8"/>
  <text class="tiny" x="29" y="165" text-anchor="middle">品名</text><text class="tiny" x="56" y="165" text-anchor="middle">規格</text><text class="tiny" x="86" y="165" text-anchor="middle">数量</text>
  <g><rect id="material_0_name_box" class="line" x="10" y="168" width="38" height="7"/><rect id="material_0_spec_box" class="line" x="48" y="168" width="29" height="7"/><rect id="material_0_quantity_box" class="line" x="77" y="168" width="25" height="7"/>
    <rect id="material_1_name_box" class="line" x="10" y="175" width="38" height="7"/><rect id="material_1_spec_box" class="line" x="48" y="175" width="29" height="7"/><rect id="material_1_quantity_box" class="line" x="77" y="175" width="25" height="7"/>
    <rect id="material_2_name_box" class="line" x="10" y="182" width="38" height="7"/><rect id="material_2_spec_box" class="line" x="48" y="182" width="29" height="7"/><rect id="material_2_quantity_box" class="line" x="77" y="182" width="25" height="7"/>
    <rect id="material_3_name_box" class="line" x="10" y="189" width="38" height="7"/><rect id="material_3_spec_box" class="line" x="48" y="189" width="29" height="7"/><rect id="material_3_quantity_box" class="line" x="77" y="189" width="25" height="7"/></g>
  <rect class="line" x="108" y="160" width="92" height="35"/><text class="small" x="110" y="166">出荷・納品</text>
  <text class="tiny" x="110" y="174">配送便</text><rect id="shipping_method_box" class="line" x="128" y="170" width="70" height="7"/>
  <text class="tiny" x="110" y="183">納品先</text><rect id="destination_box" class="line" x="128" y="179" width="70" height="7"/>
  <text class="tiny" x="110" y="192">指定時刻</text><rect id="delivery_time_box" class="line" x="128" y="188" width="70" height="5"/>

  <text class="label" x="10" y="204">数量確認</text><rect class="shade" x="10" y="207" width="190" height="8"/>
  <text class="tiny" x="25" y="212" text-anchor="middle">刷本</text><text class="tiny" x="53" y="212" text-anchor="middle">良品</text><text class="tiny" x="81" y="212" text-anchor="middle">予備</text><text class="tiny" x="109" y="212" text-anchor="middle">損紙</text><text class="tiny" x="132.5" y="212" text-anchor="middle">箱数</text><text class="tiny" x="157.5" y="212" text-anchor="middle">重量</text><text class="tiny" x="183.5" y="212" text-anchor="middle">伝票</text>
  <rect id="printed_count_box" class="line" x="10" y="215" width="28" height="10"/><rect id="good_count_box" class="line" x="38" y="215" width="28" height="10"/><rect id="spare_count_box" class="line" x="66" y="215" width="28" height="10"/><rect id="waste_count_box" class="line" x="94" y="215" width="30" height="10"/><rect id="box_count_box" class="line" x="124" y="215" width="17" height="10"/><rect id="weight_box" class="line" x="141" y="215" width="33" height="10"/><rect id="slip_box" class="line" x="174" y="215" width="26" height="10"/>

  <rect class="line" x="10" y="231" width="118" height="31"/><text class="small" x="12" y="237">備考・注意事項</text><rect id="notes_box" class="line" x="12" y="240" width="114" height="19"/>
  <rect class="line" x="134" y="231" width="66" height="31"/><text class="small" x="136" y="237">最終確認</text><rect id="final_check_box" class="line" x="136" y="240" width="62" height="19"/>
  <rect class="line" x="10" y="267" width="60" height="20"/><text class="tiny" x="12" y="273">検品者</text><rect id="inspector_box" class="line" x="12" y="276" width="56" height="8"/>
  <rect class="line" x="76" y="267" width="60" height="20"/><text class="tiny" x="78" y="273">梱包者</text><rect id="packer_box" class="line" x="78" y="276" width="56" height="8"/>
  <rect class="line" x="142" y="267" width="58" height="20"/><text class="tiny" x="144" y="273">出荷確認</text><rect id="shipper_check_box" class="line" x="144" y="276" width="54" height="8"/>
</svg>
