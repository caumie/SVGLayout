  <rect class="table-head" x="12" y="82" width="186" height="7"/><text class="label" x="15" y="87">品名</text><text class="label" x="105" y="87">商品コード</text><text class="label" x="164" y="87">数量</text><text class="label" x="184" y="87">単位</text>
  <g>
    <rect id="item_0_name_box" class="line" x="12" y="89" width="88" height="16"/><rect id="item_0_code_box" class="line" x="100" y="89" width="52" height="16"/><rect id="item_0_quantity_box" class="line" x="152" y="89" width="24" height="16"/><rect id="item_0_unit_box" class="line" x="176" y="89" width="22" height="16"/>
    <rect id="item_1_name_box" class="line" x="12" y="105" width="88" height="16"/><rect id="item_1_code_box" class="line" x="100" y="105" width="52" height="16"/><rect id="item_1_quantity_box" class="line" x="152" y="105" width="24" height="16"/><rect id="item_1_unit_box" class="line" x="176" y="105" width="22" height="16"/>
    <rect id="item_2_name_box" class="line" x="12" y="121" width="88" height="16"/><rect id="item_2_code_box" class="line" x="100" y="121" width="52" height="16"/><rect id="item_2_quantity_box" class="line" x="152" y="121" width="24" height="16"/><rect id="item_2_unit_box" class="line" x="176" y="121" width="22" height="16"/>
