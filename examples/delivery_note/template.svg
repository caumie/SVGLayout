<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <style>
    .label { fill:#333; font-family:'Yu Gothic',sans-serif; font-size:3.3px; }
    .line { fill:#fff; stroke:#777; stroke-width:.25; }
    .header { fill:#276b5c; }
    .table-head { fill:#dceee8; }
  </style>
  <rect class="header" x="10" y="10" width="190" height="18" rx="1.5"/><rect id="page_title_box" x="15" y="12" width="100" height="14" fill="none" stroke="none"/>
