<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <title>納品書</title>
  <style>
    .paper { fill:#fff; stroke:#1f2933; stroke-width:.35; }
    .line { fill:#fff; stroke:#1f2933; stroke-width:.25; }
    .header { fill:#276b5c; }
    .head { fill:#fff; font-family:'Yu Mincho','Noto Serif JP',serif; font-size:8px; font-weight:700; letter-spacing:1px; }
    .header-label { fill:#fff; }
    .label { fill:#24323d; font-family:'Yu Gothic','Meiryo',sans-serif; font-size:3px; }
    .small { fill:#24323d; font-family:'Yu Gothic','Meiryo',sans-serif; font-size:2.7px; }
    .tiny { fill:#24323d; font-family:'Yu Gothic','Meiryo',sans-serif; font-size:2.25px; }
    .table-head { fill:#dceee8; stroke:#1f2933; stroke-width:.25; }
  </style>

  <rect class="paper" x=".5" y=".5" width="209" height="296"/>
  <rect class="header" x="10" y="10" width="190" height="18" rx="1.5"/>
  <text class="head" x="16" y="21">納 品 書</text>
  <text class="small header-label" x="126" y="15">納品書番号</text>
  <rect id="delivery_number_box" class="line" x="150" y="11" width="45" height="7"/>
  <text class="small header-label" x="126" y="24">納品日</text>
  <rect id="delivery_date_box" class="line" x="150" y="20" width="45" height="7"/>

  <rect class="line" x="12" y="34" width="94" height="26"/>
  <text class="small" x="14" y="39">納品先</text>
  <text class="tiny" x="14" y="48">宛名</text>
  <rect id="destination_name_box" class="line" x="31" y="42" width="72" height="7"/>
  <text class="tiny" x="14" y="56">住所</text>
  <rect id="destination_address_box" class="line" x="31" y="50" width="72" height="8"/>

  <rect class="line" x="114" y="34" width="84" height="26"/>
  <text class="small" x="116" y="39">納品元</text>
  <text class="tiny" x="116" y="48">会社名</text>
  <rect id="shipper_name_box" class="line" x="135" y="42" width="60" height="7"/>
  <text class="tiny" x="116" y="56">住所</text>
  <rect id="shipper_address_box" class="line" x="135" y="50" width="60" height="8"/>

  <rect class="line" x="12" y="66" width="186" height="14"/>
  <text class="tiny" x="14" y="71">注文番号</text>
  <rect id="order_number_box" class="line" x="32" y="68" width="43" height="8"/>
  <text class="tiny" x="79" y="71">納品場所</text>
  <rect id="delivery_place_box" class="line" x="98" y="68" width="40" height="8"/>
  <text class="tiny" x="142" y="71">納品方法</text>
  <rect id="delivery_method_box" class="line" x="161" y="68" width="35" height="8"/>

  <text class="label" x="12" y="88">納品明細</text>
  <rect class="table-head" x="12" y="91" width="186" height="8"/>
  <text class="tiny" x="17" y="96" text-anchor="middle">No.</text>
  <text class="tiny" x="37.5" y="96" text-anchor="middle">商品コード</text>
  <text class="tiny" x="87" y="96" text-anchor="middle">品名・規格</text>
  <text class="tiny" x="130" y="96" text-anchor="middle">数量</text>
  <text class="tiny" x="145.5" y="96" text-anchor="middle">単位</text>
  <text class="tiny" x="164.5" y="96" text-anchor="middle">金額</text>
  <text class="tiny" x="187" y="96" text-anchor="middle">備考</text>
