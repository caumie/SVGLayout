    <rect id="item_0_no_box" class="line" x="12" y="99" width="10" height="11"/><rect id="item_0_code_box" class="line" x="22" y="99" width="31" height="11"/><rect id="item_0_name_box" class="line" x="53" y="99" width="68" height="11"/><rect id="item_0_quantity_box" class="line" x="121" y="99" width="18" height="11"/><rect id="item_0_unit_box" class="line" x="139" y="99" width="13" height="11"/><rect id="item_0_amount_box" class="line" x="152" y="99" width="25" height="11"/><rect id="item_0_note_box" class="line" x="177" y="99" width="21" height="11"/>
    <rect id="item_1_no_box" class="line" x="12" y="110" width="10" height="11"/><rect id="item_1_code_box" class="line" x="22" y="110" width="31" height="11"/><rect id="item_1_name_box" class="line" x="53" y="110" width="68" height="11"/><rect id="item_1_quantity_box" class="line" x="121" y="110" width="18" height="11"/><rect id="item_1_unit_box" class="line" x="139" y="110" width="13" height="11"/><rect id="item_1_amount_box" class="line" x="152" y="110" width="25" height="11"/><rect id="item_1_note_box" class="line" x="177" y="110" width="21" height="11"/>
    <rect id="item_2_no_box" class="line" x="12" y="121" width="10" height="11"/><rect id="item_2_code_box" class="line" x="22" y="121" width="31" height="11"/><rect id="item_2_name_box" class="line" x="53" y="121" width="68" height="11"/><rect id="item_2_quantity_box" class="line" x="121" y="121" width="18" height="11"/><rect id="item_2_unit_box" class="line" x="139" y="121" width="13" height="11"/><rect id="item_2_amount_box" class="line" x="152" y="121" width="25" height="11"/><rect id="item_2_note_box" class="line" x="177" y="121" width="21" height="11"/>
    <rect id="item_3_no_box" class="line" x="12" y="132" width="10" height="11"/><rect id="item_3_code_box" class="line" x="22" y="132" width="31" height="11"/><rect id="item_3_name_box" class="line" x="53" y="132" width="68" height="11"/><rect id="item_3_quantity_box" class="line" x="121" y="132" width="18" height="11"/><rect id="item_3_unit_box" class="line" x="139" y="132" width="13" height="11"/><rect id="item_3_amount_box" class="line" x="152" y="132" width="25" height="11"/><rect id="item_3_note_box" class="line" x="177" y="132" width="21" height="11"/>
    <rect id="item_4_no_box" class="line" x="12" y="143" width="10" height="11"/><rect id="item_4_code_box" class="line" x="22" y="143" width="31" height="11"/><rect id="item_4_name_box" class="line" x="53" y="143" width="68" height="11"/><rect id="item_4_quantity_box" class="line" x="121" y="143" width="18" height="11"/><rect id="item_4_unit_box" class="line" x="139" y="143" width="13" height="11"/><rect id="item_4_amount_box" class="line" x="152" y="143" width="25" height="11"/><rect id="item_4_note_box" class="line" x="177" y="143" width="21" height="11"/>
    <rect id="item_5_no_box" class="line" x="12" y="154" width="10" height="11"/><rect id="item_5_code_box" class="line" x="22" y="154" width="31" height="11"/><rect id="item_5_name_box" class="line" x="53" y="154" width="68" height="11"/><rect id="item_5_quantity_box" class="line" x="121" y="154" width="18" height="11"/><rect id="item_5_unit_box" class="line" x="139" y="154" width="13" height="11"/><rect id="item_5_amount_box" class="line" x="152" y="154" width="25" height="11"/><rect id="item_5_note_box" class="line" x="177" y="154" width="21" height="11"/>
    <rect id="item_6_no_box" class="line" x="12" y="165" width="10" height="11"/><rect id="item_6_code_box" class="line" x="22" y="165" width="31" height="11"/><rect id="item_6_name_box" class="line" x="53" y="165" width="68" height="11"/><rect id="item_6_quantity_box" class="line" x="121" y="165" width="18" height="11"/><rect id="item_6_unit_box" class="line" x="139" y="165" width="13" height="11"/><rect id="item_6_amount_box" class="line" x="152" y="165" width="25" height="11"/><rect id="item_6_note_box" class="line" x="177" y="165" width="21" height="11"/>
    <rect id="item_7_no_box" class="line" x="12" y="176" width="10" height="11"/><rect id="item_7_code_box" class="line" x="22" y="176" width="31" height="11"/><rect id="item_7_name_box" class="line" x="53" y="176" width="68" height="11"/><rect id="item_7_quantity_box" class="line" x="121" y="176" width="18" height="11"/><rect id="item_7_unit_box" class="line" x="139" y="176" width="13" height="11"/><rect id="item_7_amount_box" class="line" x="152" y="176" width="25" height="11"/><rect id="item_7_note_box" class="line" x="177" y="176" width="21" height="11"/>
  </g>

  <rect class="line" x="12" y="191" width="99" height="34"/>
  <text class="small" x="14" y="197">備考</text>
  <rect id="note_box" class="line" x="14" y="200" width="95" height="22"/>
  <rect class="line" x="123" y="191" width="75" height="34"/>
  <text class="small" x="126" y="198">小計</text><rect id="subtotal_box" class="line" x="158" y="193" width="37" height="8"/>
  <text class="small" x="126" y="208">消費税</text><rect id="tax_box" class="line" x="158" y="203" width="37" height="8"/>
  <text class="small" x="126" y="219">合計</text><rect id="total_box" class="line" x="153" y="213" width="42" height="10"/>

  <rect class="line" x="12" y="232" width="84" height="25"/>
  <text class="tiny" x="14" y="238">担当者</text><rect id="staff_box" class="line" x="14" y="241" width="78" height="12"/>
  <rect class="line" x="100" y="232" width="46" height="25"/>
  <text class="tiny" x="102" y="238">受領者</text><rect id="receiver_box" class="line" x="102" y="241" width="42" height="12"/>
  <rect id="receiver_stamp_box" class="line" x="151" y="232" width="47" height="25"/>
