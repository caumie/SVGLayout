<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <style>
    .label { fill:#202124; font-family:'Yu Gothic',sans-serif; font-size:3.1px; }
    .line { fill:#fff; stroke:#202124; stroke-width:.25; }
    .rail { fill:#182b49; }
    .red { fill:#d1495b; }
    .blue { fill:#0077b6; }
    .pale { fill:#e8f1f8; }
    .white { fill:#fff; font-family:'Yu Gothic',sans-serif; font-size:3.1px; }
    .title { font-size:7px; font-weight:700; }
  </style>
  <rect class="rail" x="8" y="8" width="18" height="281" rx="2"/>
  <text class="white title" x="17" y="45" text-anchor="middle" transform="rotate(-90 17 45)">発注申請</text>
  <text class="white" x="17" y="80" text-anchor="middle" transform="rotate(-90 17 80)">PURCHASE ORDER</text>
  <text class="white" x="17" y="250" text-anchor="middle" transform="rotate(-90 17 250)">社内回覧　→　承認　→　発注</text>

  <rect class="blue" x="32" y="8" width="126" height="22" rx="1.5"/><text class="white title" x="39" y="22">発 注 書</text>
  <text class="white" x="118" y="17">緊急時は赤枠を確認</text><rect id="priority_box" class="red" x="119" y="19" width="16" height="7"/><rect id="expedited_box" class="red" x="137" y="19" width="16" height="7"/>
  <rect id="approval_stamp_box" class="line" x="166" y="8" width="35" height="35"/>

  <rect class="pale" x="32" y="36" width="70" height="9"/><text class="label" x="36" y="42">発注先（納入業者）</text><rect id="vendor_name_box" class="line" x="32" y="45" width="70" height="10"/><rect id="vendor_address_box" class="line" x="32" y="55" width="70" height="19"/>
  <rect class="pale" x="107" y="36" width="51" height="9"/><text class="label" x="111" y="42">発注管理番号</text><rect id="order_number_box" class="line" x="107" y="45" width="51" height="8"/><text class="label" x="107" y="63">発注日</text><rect id="order_date_box" class="line" x="107" y="66" width="51" height="8"/><text class="label" x="107" y="81">希望納期</text><rect id="delivery_date_box" class="line" x="107" y="84" width="51" height="8"/>

  <rect class="blue" x="32" y="99" width="126" height="9"/><text class="white" x="36" y="105">明細：コードと数量を照合　□ 未発注　□ 発注済</text>
  <rect fill="#dcebf7" x="32" y="108" width="126" height="8"/><text class="label" x="35" y="114">品名・仕様</text><text class="label" x="91" y="114">数量</text><text class="label" x="106" y="114">単位</text><text class="label" x="124" y="114">単価</text><text class="label" x="145" y="114">金額</text>
  <g>
    <rect id="item_0_name_box" class="line" x="32" y="116" width="54" height="18"/><rect id="item_0_quantity_box" class="line" x="86" y="116" width="17" height="18"/><rect id="item_0_unit_box" class="line" x="103" y="116" width="18" height="18"/><rect id="item_0_price_box" class="line" x="121" y="116" width="19" height="18"/><rect id="item_0_amount_box" class="line" x="140" y="116" width="18" height="18"/>
    <rect id="item_1_name_box" class="line" x="32" y="134" width="54" height="18"/><rect id="item_1_quantity_box" class="line" x="86" y="134" width="17" height="18"/><rect id="item_1_unit_box" class="line" x="103" y="134" width="18" height="18"/><rect id="item_1_price_box" class="line" x="121" y="134" width="19" height="18"/><rect id="item_1_amount_box" class="line" x="140" y="134" width="18" height="18"/>
    <rect id="item_2_name_box" class="line" x="32" y="152" width="54" height="18"/><rect id="item_2_quantity_box" class="line" x="86" y="152" width="17" height="18"/><rect id="item_2_unit_box" class="line" x="103" y="152" width="18" height="18"/><rect id="item_2_price_box" class="line" x="121" y="152" width="19" height="18"/><rect id="item_2_amount_box" class="line" x="140" y="152" width="18" height="18"/>
  </g>
  <text class="label" x="32" y="181">納品先（分納時は備考へ記載）</text><rect id="destination_box" class="line" x="32" y="184" width="126" height="12"/>
  <text class="label" x="32" y="207">発注メモ・検収条件</text><rect id="remarks_box" class="line" x="32" y="210" width="126" height="30"/>
  <text class="label" x="125" y="251">小計</text><rect id="subtotal_box" class="line" x="140" y="246" width="18" height="8"/><text class="label" x="125" y="262">消費税</text><rect id="tax_box" class="line" x="140" y="257" width="18" height="8"/><text class="label" x="121" y="276">発注合計</text><rect id="total_box" class="line" x="138" y="278" width="20" height="11"/>

  <rect class="red" x="166" y="49" width="35" height="9"/><text class="white" x="170" y="55">申請者</text><rect id="requester_name_box" class="line" x="166" y="58" width="35" height="9"/><rect id="requester_department_box" class="line" x="166" y="67" width="35" height="9"/><rect id="requester_phone_box" class="line" x="166" y="76" width="35" height="9"/><rect id="requester_signature_box" class="line" x="166" y="87" width="35" height="24"/>
  <rect class="red" x="166" y="119" width="35" height="9"/><text class="white" x="170" y="125">承認ルート</text><rect id="approval_0_role_box" class="line" x="166" y="128" width="35" height="9"/><rect id="approval_0_name_box" class="line" x="166" y="137" width="35" height="9"/><rect id="approval_1_role_box" class="line" x="166" y="146" width="35" height="9"/><rect id="approval_1_name_box" class="line" x="166" y="155" width="35" height="9"/>
  <text class="label" x="166" y="181">記号</text><text class="label" x="166" y="188">□ 未確認</text><text class="label" x="166" y="195">△ 要連絡</text><text class="label" x="166" y="202">★ 至急</text>
</svg>
