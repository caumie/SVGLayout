    <html:div class="svgrb-container" data-svgrb-role="container" style="width:100%;height:100%;box-sizing:border-box;font-family:&quot;Yu Gothic&quot;, &quot;Meiryo&quot;, sans-serif;font-size:3.4px;line-height:1.3;padding:1px;white-space:pre-wrap;text-align:right;">10.0</html:div>
  </foreignObject>
