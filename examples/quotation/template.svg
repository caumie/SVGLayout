  <rect fill="#d8f3dc" x="88" y="48" width="110" height="7"/><text class="label" x="91" y="53">内容</text><text class="label" x="143" y="53">数量</text><text class="label" x="153" y="53">単位</text><text class="label" x="169" y="53">単価</text><text class="label" x="185" y="53">金額</text>
  <rect id="item_0_name_box" class="line" x="88" y="55" width="50" height="18"/><rect id="item_0_quantity_box" class="line" x="138" y="55" width="13" height="18"/><rect id="item_0_unit_box" class="line" x="151" y="55" width="14" height="18"/><rect id="item_0_price_box" class="line" x="165" y="55" width="17" height="18"/><rect id="item_0_amount_box" class="line" x="182" y="55" width="16" height="18"/>
  <rect fill="#fff4cc" x="88" y="73" width="110" height="18"/><rect id="item_1_name_box" class="line" x="88" y="73" width="50" height="18"/><rect id="item_1_quantity_box" class="line" x="138" y="73" width="13" height="18"/><rect id="item_1_unit_box" class="line" x="151" y="73" width="14" height="18"/><rect id="item_1_price_box" class="line" x="165" y="73" width="17" height="18"/><rect id="item_1_amount_box" class="line" x="182" y="73" width="16" height="18"/>
