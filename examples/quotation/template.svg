<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
  <style>
    .label { fill:#263238; font-family:'Yu Gothic',sans-serif; font-size:3.2px; }
    .line { fill:#fff; stroke:#263238; stroke-width:.25; }
    .dark { fill:#264653; }
    .green { fill:#2a9d8f; }
    .yellow { fill:#e9c46a; }
    .orange { fill:#f4a261; }
    .coral { fill:#e76f51; }
    .white-title { fill:#fff; font-family:'Yu Gothic',sans-serif; font-size:8px; font-weight:700; }
    .white-label { fill:#fff; font-family:'Yu Gothic',sans-serif; font-size:3.2px; }
  </style>
  <rect class="dark" x="10" y="10" width="190" height="22" rx="2"/>
  <rect class="coral" x="10" y="10" width="10" height="22" rx="2"/>
  <text class="white-title" x="25" y="24">見積提案シート　◎ ご検討用</text>
  <rect id="seller_seal_box" class="line" x="177" y="12" width="18" height="18"/>

  <rect class="green" x="10" y="39" width="72" height="9"/><text class="white-label" x="14" y="45">A｜ご提案先</text>
  <rect id="buyer_name_box" class="line" x="10" y="48" width="72" height="10"/><rect id="buyer_person_box" class="line" x="10" y="58" width="72" height="9"/>
